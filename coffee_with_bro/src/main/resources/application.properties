spring.application.name=coffee_with_bro

# Dynamic server port resolution (supports $PORT from cloud platforms such as Railway, Render, Fly.io, Cloud Run)
server.port=${PORT:8080}

# ASL Model and Label paths
asl.model-path=${ASL_MODEL_PATH:models/asl_cnn_model.zip}
asl.labels-path=${ASL_LABELS_PATH:models/labels.txt}

# In-memory H2 Database configuration for translation session persistence
spring.datasource.url=jdbc:h2:mem:coffeewithbro;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# H2 Console enabled for diagnostic reviews
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
