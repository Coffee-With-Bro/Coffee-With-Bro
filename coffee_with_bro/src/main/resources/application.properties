spring.application.name=coffee_with_bro

# Where the trained CNN and its label list live on disk.
# These are build artifacts, not source, so they are not in the repo - point
# these at wherever TrainAslCnn wrote them on your machine. Override without
# editing this file via environment variables:
#   ASL_MODEL_PATH=/path/to/asl_cnn_model.zip ASL_LABELS_PATH=/path/to/labels.txt
# or on the command line:
#   ./mvnw spring-boot:run -Dspring-boot.run.arguments=--asl.model-path=/path/to/asl_cnn_model.zip
asl.model-path=${ASL_MODEL_PATH:models/asl_cnn_model.zip}
asl.labels-path=${ASL_LABELS_PATH:models/labels.txt}
