# Production Profile Configuration for Cloud Environments

# Secure H2 console in production (disabled by default unless explicitly enabled)
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}

# Optimize logging for cloud aggregators (clean, structured console logging)
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.level.org.springframework=INFO
logging.level.com.coffeewithbro=INFO

