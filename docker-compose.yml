version: "3.8"

services:
  backend:
    build:
      context: ./coffee_with_bro
      dockerfile: Dockerfile
    container_name: coffee_backend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - SPRING_PROFILES_ACTIVE=prod
      - ASL_MODEL_PATH=/app/models/asl_cnn_model.zip
      - ASL_LABELS_PATH=/app/models/labels.txt
    volumes:
      - ./models:/app/models:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/status"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: milk_with_bro/Dockerfile
    container_name: milk_frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

