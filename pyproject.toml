[build-system]
requires = 
[
    "setuptools>=61.0"
]
build-backend = "setuptools.build_meta"

[project]
name = "coffee-with-bro"
version = "1.0.0"
description = "Multi-language Sign Language Recognition and Translation System"
readme = "README.md"
requires-python = ">=3.10"
dependencies = 
[
    "opencv-python>=4.10.0",
    "albumentations>=2.0.0",
    "mediapipe>=0.10.14",
    "pillow>=10.3.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "tqdm>=4.66.0",
    "requests>=2.31.0",
    "kaggle>=1.6.0"
]
